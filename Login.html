<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/assets/Dine.png">
    <title>Login | Mosaic Dine</title>
    <link rel="stylesheet" href="Styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
    <div class="login-page">
        <div class="login-background"></div>
        <!-- LOGIN CARD -->
        <div class="login-card">
            <!-- LOGO -->
            <div class="login-header">
                <a href="index.html">
                    <img src="/assets/Dine.png" alt="Mosaic Dine Logo">
                </a>
                <span class="login-label">
                    WELCOME TO
                </span>
                <h1>
                    Mosaic <strong>Dine</strong>
                </h1>
                <p>
                    Sign in to continue your delicious journey.
                </p>
            </div>
            <!-- LOGIN FORM -->
            <form id="loginForm">
                <!-- LOGIN TYPE -->
                <div class="login-input">
                    <i class="fa fa-user"></i>
                    <select id="loginRole" required>
                        <option value="">
                            Login As
                        </option>
                        <option value="customer">
                            Customer
                        </option>
                        <option value="admin">
                            Admin
                        </option>
                    </select>
                </div>
                <br>
                <!-- EMAIL -->
                <div class="login-input">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="email" placeholder="Enter your email" required>
                </div>
                <br>
                <!-- PASSWORD -->
                <div class="login-input">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter your password" required>
                </div>
                <br>
                <!-- LOGIN MESSAGE -->
                <div id="loginMessage" style="text-align: center; margin-bottom: 12px;">
                </div>
                <!-- LOGIN BUTTON -->
                <button type="submit" class="login-submit">
                    Continue
                    <i class="fa fa-arrow-right"></i>
                </button>
            </form>
            <!-- DIVIDER -->
            <div class="login-divider">
                <span>
                    or continue with
                </span>
            </div>
            <!-- SOCIAL LOGIN -->
            <div class="social-login">
                <!-- GOOGLE -->
                <button type="button" class="social-btn google" aria-label="Login with Google">
                    <i class="fa fa-google"></i>
                    Google
                </button>
                <!-- FACEBOOK -->
                <button type="button" class="social-btn facebook" aria-label="Login with Facebook">
                    <i class="fa fa-facebook"></i>
                    Facebook
                </button>
                <!-- INSTAGRAM -->
                <button type="button" class="social-btn instagram" aria-label="Login with Instagram">
                    <i class="fa fa-instagram"></i>
                    Instagram
                </button>
            </div>
            <!-- SIGNUP -->
            <div class="signup-text">
                <p>
                    Don't have an account?
                    <a href="Signup.html">
                        Create an account
                    </a>
                </p>
            </div>
            <!-- HOME -->
            <a href="index.html" class="back-home">
                <i class="fa fa-arrow-left"></i>
                Back to Home
            </a>
        </div>
    </div>
    <!-- JAVASCRIPT -->
    <script>
        /* =====================================================
           ELEMENTS
           ===================================================== */
        const form =
            document.getElementById("loginForm");
        const loginRole =
            document.getElementById("loginRole");
        const emailInput =
            document.getElementById("email");
        const passwordInput =
            document.getElementById("password");
        const loginMessage =
            document.getElementById("loginMessage");
        /* =====================================================
           LOGIN
           ===================================================== */
        form.addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();
                const role =
                    loginRole.value;
                const email =
                    emailInput.value.trim();
                const password =
                    passwordInput.value;
                /* =================================================
                   ROLE VALIDATION
                   ================================================= */
                if (role === "") {
                    alert(
                        "Please select Customer or Admin."
                    );
                    return;
                }
                /* =================================================
                   EMAIL VALIDATION
                   ================================================= */
                if (email === "") {
                    alert(
                        "Please enter your email."
                    );
                    return;
                }
                const emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(email)) {
                    alert(
                        "Please enter a valid email address."
                    );
                    return;
                }
                /* =================================================
                   PASSWORD VALIDATION
                   ================================================= */
                if (password === "") {
                    alert(
                        "Please enter your password."
                    );
                    return;
                }
                loginMessage.innerHTML = "";
                try {
                    /* =================================================
                       CUSTOMER LOGIN
                       ================================================= */
                    if (role === "customer") {
                        const response =
                            await fetch(
                                "http://localhost:3000/login",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },
                                    body: JSON.stringify({
                                        email: email,
                                        password: password
                                    })
                                }
                            );
                        const result =
                            await response.json();
                        /* =================================================
                           CUSTOMER LOGIN SUCCESS
                           ================================================= */
                        if (result.success) {
                            /* Remove old admin session */
                            localStorage.removeItem(
                                "adminLoggedIn"
                            );
                            localStorage.removeItem(
                                "adminUser"
                            );
                            localStorage.removeItem(
                                "adminToken"
                            );
                            /* ==========================================
                               STORE CUSTOMER
                               ========================================== */
                            localStorage.setItem(
                                "loggedInUser",
                                JSON.stringify(result.user)
                            );
                            /* ==========================================
                               ALSO STORE USING MY ORDERS KEY
                               ========================================== */
                            localStorage.setItem(
                                "mosaicDineUser",
                                JSON.stringify(result.user)
                            );
                            alert(
                                "Welcome back, " +
                                result.user.name +
                                "!\n\nLogin Successful."
                            );
                            window.location.href =
                                "Index.html";
                        }
                        /* =================================================
                           CUSTOMER LOGIN FAILED
                           ================================================= */
                        else {
                            alert(
                                result.message
                            );
                        }
                    }
                    /* =================================================
                       ADMIN LOGIN
                       ================================================= */
                    else if (role === "admin") {
                        const response =
                            await fetch(
                                "http://localhost:3000/admin/login",
                                {
                                    method: "POST",
                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },
                                    body: JSON.stringify({
                                        email: email,
                                        password: password
                                    })
                                }
                            );
                        const result =
                            await response.json();
                        /* =================================================
                           ADMIN LOGIN SUCCESS
                           ================================================= */
                        if (result.success) {
                            /* Store admin login state */
                            localStorage.setItem(
                                "adminLoggedIn",
                                "true"
                            );
                            /* Store admin details */
                            localStorage.setItem(
                                "adminUser",
                                JSON.stringify(result.admin)
                            );
                            /* Store JWT token */
                            localStorage.setItem(
                                "adminToken",
                                result.token
                            );
                            /* Remove customer login */
                            localStorage.removeItem(
                                "loggedInUser"
                            );
                            localStorage.removeItem(
                                "mosaicDineUser"
                            );
                            alert(
                                "Admin Login Successful!"
                            );
                            /* Go to Home */
                            window.location.href =
                                "Index.html";
                        }
                        /* =================================================
                           ADMIN LOGIN FAILED
                           ================================================= */
                        else {
                            localStorage.removeItem(
                                "adminLoggedIn"
                            );
                            localStorage.removeItem(
                                "adminUser"
                            );
                            localStorage.removeItem(
                                "adminToken"
                            );
                            alert(
                                result.message
                            );
                        }
                    }
                }
                catch (error) {
                    console.error(
                        "Login Error:",
                        error
                    );
                    alert(
                        "Unable to connect to the server.\n\n" +
                        "Please make sure the backend server is running."
                    );
                }
            }
        );
        /* =====================================================
           GOOGLE LOGIN
           ===================================================== */
        document
            .querySelector(".google")
            .addEventListener(
                "click",
                function () {
                    alert(
                        "Google Login Coming Soon!"
                    );
                }
            );
        /* =====================================================
           FACEBOOK LOGIN
           ===================================================== */
        document
            .querySelector(".facebook")
            .addEventListener(
                "click",
                function () {
                    alert(
                        "Facebook Login Coming Soon!"
                    );
                }
            );
        /* =====================================================
           INSTAGRAM LOGIN
           ===================================================== */
        document
            .querySelector(".instagram")
            .addEventListener(
                "click",
                function () {
                    alert(
                        "Instagram Login Coming Soon!"
                    );
                }
            );
    </script>
</body>

</html>
